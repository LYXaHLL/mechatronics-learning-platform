<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#16243d" />
<link rel="icon" type="image/png" href="./jd/icons/favicon-32.png" />
<link rel="apple-touch-icon" href="./jd/icons/apple-touch-icon.png" />
<title>广州造船厂技工学校 · 培训平台</title>
<style>
  :root { --navy:#16243d; --primary:#2563eb; --text:#1a2433; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; background:linear-gradient(160deg,#f2f5fa,#e8eefb); color:var(--text); min-height:100vh; }
  .wrap { max-width:520px; margin:0 auto; padding:40px 20px; }
  .brand { text-align:center; margin-bottom:8px; }
  .brand .logo { width:116px; height:116px; border-radius:50%; object-fit:cover; box-shadow:0 6px 20px rgba(16,24,40,.2); }
  .brand p { color:#6b7688; font-size:15px; margin-top:14px; }
  .card { display:flex; align-items:center; gap:16px; background:#fff; border-radius:18px; box-shadow:0 8px 24px rgba(16,24,40,.1); padding:22px 20px; margin:18px 0; text-decoration:none; color:var(--text); transition:.18s; }
  .card:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(16,24,40,.15); }
  .card .ico { font-size:42px; }
  .card .t { font-size:17px; font-weight:700; }
  .card .d { font-size:13px; color:#6b7688; margin-top:4px; }
  .card .arrow { margin-left:auto; color:#2563eb; font-weight:700; font-size:20px; }
  .foot { text-align:center; color:#9aa4b2; font-size:12px; margin-top:30px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="./jd/icons/apple-touch-icon.png" alt="广州造船厂技工学校校徽" />
      <p>在线培训平台</p>
    </div>
    <a class="card" href="./dg/">
      <div class="ico">⚡</div>
      <div><div class="t">电工上岗证培训平台</div><div class="d">低压/高压电工、电气试验、继电保护、电力电缆、防爆电气 · 刷题 / 模拟考试 / 错题本</div></div>
      <div class="arrow">›</div>
    </a>
    <a class="card" href="./jd/">
      <div class="ico">⚙️</div>
      <div><div class="t">机电一体化技术学习平台</div><div class="d">机械、电工电子、传感器、控制、PLC 与机器人知识学习</div></div>
      <div class="arrow">›</div>
    </a>
    <div class="foot">广州造船厂技工学校 · 在线培训平台</div>
  </div>
</body>
</html>
