<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1e2a3d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="机电一体化技术学习平台" />
<title>广州造船厂技工学校机电一体化技术学习平台</title>
<style>
:root {
  --bg: #f4f6fb;
  --sidebar-bg: #1e2a3d;
  --sidebar-text: #c8d2e3;
  --sidebar-active: #2f7bff;
  --card: #ffffff;
  --text: #1f2937;
  --text-muted: #6b7280;
  --border: #e5e7eb;
  --primary: #2f7bff;
  --primary-soft: #e8f0ff;
  --green: #16a34a;
  --green-soft: #e6f7ec;
  --amber: #d97706;
  --red: #dc2626;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
}

.app { display: flex; min-height: 100vh; }

/* ===== 侧边栏 ===== */
.sidebar {
  width: 290px;
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  height: 100vh;
  position: sticky;
  top: 0;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 22px 20px 16px; }
.brand-logo { font-size: 30px; }
.brand-text h1 { font-size: 19px; color: #fff; font-weight: 700; }
.brand-text p { font-size: 12px; color: var(--sidebar-text); opacity: .8; }

.search-box { padding: 0 16px 14px; }
.search-box input {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #33415a;
  background: #16202f; color: #fff; font-size: 14px; outline: none;
}
.search-box input::placeholder { color: #5f6c82; }
.search-box input:focus { border-color: var(--primary); }

.nav { flex: 1; overflow-y: auto; padding: 4px 10px 20px; }
.nav::-webkit-scrollbar { width: 6px; }
.nav::-webkit-scrollbar-thumb { background: #33415a; border-radius: 3px; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; margin-bottom: 3px; border-radius: 10px;
  cursor: pointer; color: var(--sidebar-text); font-size: 14px;
  transition: background .15s; user-select: none;
}
.nav-item:hover { background: #243248; color: #fff; }
.nav-item.active { background: var(--primary); color: #fff; }
.nav-item .ico { font-size: 18px; width: 22px; text-align: center; }
.nav-item .label { flex: 1; }
.nav-item .pct { font-size: 11px; opacity: .85; }

.sidebar-footer { padding: 12px 16px; border-top: 1px solid #33415a; }
.btn-reset {
  width: 100%; padding: 8px; background: transparent; border: 1px solid #33415a;
  color: var(--sidebar-text); border-radius: 8px; cursor: pointer; font-size: 13px;
}
.btn-reset:hover { background: #33415a; color: #fff; }

/* ===== 顶栏 ===== */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 28px; background: #fff; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
.btn-menu { display: none; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text); }
.breadcrumb { font-size: 16px; font-weight: 600; }
.topbar-progress { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-muted); }
.progress-bar { width: 140px; height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); transition: width .3s; }

.content { padding: 28px; max-width: 960px; width: 100%; margin: 0 auto; }

/* ===== 通用卡片 ===== */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 20px; }
.card h2 { font-size: 20px; margin-bottom: 12px; }
.card h3 { font-size: 16px; margin: 18px 0 8px; }
.card p { color: var(--text); margin-bottom: 10px; }
.muted { color: var(--text-muted); }

/* ===== 首页 ===== */
.hero { background: linear-gradient(135deg, #2f7bff, #6a5cff); color: #fff; border-radius: var(--radius); padding: 36px 32px; margin-bottom: 24px; }
.hero h1 { font-size: 26px; margin-bottom: 8px; }
.hero p { opacity: .9; font-size: 15px; margin-bottom: 0; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; text-align: center; }
.stat .num { font-size: 28px; font-weight: 700; color: var(--primary); }
.stat .lbl { font-size: 13px; color: var(--text-muted); }

.module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.module-card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px; cursor: pointer; transition: transform .15s, box-shadow .15s;
}
.module-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(16,24,40,.12); }
.module-card .m-ico { font-size: 30px; margin-bottom: 10px; }
.module-card h3 { font-size: 16px; margin-bottom: 6px; }
.module-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
.module-card .m-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }

.badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.badge-done { background: var(--green-soft); color: var(--green); }
.badge-ing { background: var(--amber); color: #fff; }

/* ===== 章节列表 ===== */
.chapter-item {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; cursor: pointer;
  transition: background .15s;
}
.chapter-item:hover { background: #f9fafb; }
.chapter-item .idx { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.chapter-item .c-info { flex: 1; }
.chapter-item .c-title { font-weight: 600; }
.chapter-item .c-desc { font-size: 13px; color: var(--text-muted); }
.chapter-item .done-mark { color: var(--green); font-size: 20px; }

/* ===== 章节阅读 ===== */
.read-head { margin-bottom: 20px; }
.read-head h2 { font-size: 24px; margin-bottom: 6px; }
.read-head .muted { font-size: 14px; }
.section-block { margin-bottom: 22px; }
.section-block h3 { font-size: 17px; margin-bottom: 10px; padding-left: 12px; border-left: 4px solid var(--primary); }
.section-block ul { padding-left: 22px; }
.section-block li { margin-bottom: 6px; }
.section-block table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
.section-block th, .section-block td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
.section-block th { background: #f9fafb; }

.keybox { background: var(--primary-soft); border-radius: 10px; padding: 14px 16px; margin-top: 10px; }
.keybox h4 { color: var(--primary); font-size: 14px; margin-bottom: 6px; }
.keybox ul { padding-left: 20px; }

.read-actions { display: flex; gap: 12px; margin-top: 24px; }
.btn { padding: 10px 22px; border-radius: 10px; border: none; cursor: pointer; font-size: 15px; font-weight: 600; transition: background .15s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
.btn-outline:hover { background: var(--primary-soft); }
.btn-grey { background: var(--border); color: var(--text); }
.btn-grey:hover { background: #d1d5db; }

/* ===== 测验 ===== */
.quiz-q { margin-bottom: 24px; }
.quiz-q .q-text { font-weight: 600; margin-bottom: 10px; }
.quiz-opt { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: background .15s; }
.quiz-opt:hover { background: #f9fafb; }
.quiz-opt.selected { border-color: var(--primary); background: var(--primary-soft); }
.quiz-opt.correct { border-color: var(--green); background: var(--green-soft); }
.quiz-opt.wrong { border-color: var(--red); background: #fdeaea; }
.quiz-opt .opt-tag { font-weight: 700; width: 22px; }
.quiz-explain { display: none; background: #f9fafb; border-left: 4px solid var(--primary); padding: 10px 14px; border-radius: 6px; font-size: 14px; margin-top: 6px; }
.quiz-explain.show { display: block; }

.score-bar { text-align: center; padding: 20px; }
.score-bar .big { font-size: 40px; font-weight: 700; color: var(--primary); }

/* ===== 空状态 ===== */
.empty { text-align: center; color: var(--text-muted); padding: 50px 20px; }
.empty .e-ico { font-size: 48px; margin-bottom: 12px; }
.search-highlight { background: #fff3bf; border-radius: 3px; }

/* ===== 响应式（手机端） ===== */
body { -webkit-tap-highlight-color: transparent; }

@media (max-width: 768px) {
  .sidebar {
    position: fixed; left: -290px; top: 0; bottom: 0; width: 290px;
    transition: left .25s ease; z-index: 60; height: 100vh;
  }
  .sidebar.open { left: 0; box-shadow: 0 0 40px rgba(0,0,0,.35); }
  body.menu-open::before { content: ""; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 55; }
  .btn-menu { display: block; font-size: 24px; }
  .topbar { padding: 12px 14px; gap: 10px; padding-top: calc(12px + env(safe-area-inset-top)); }
  .breadcrumb { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-progress .progress-bar { width: 80px; }
  .content { padding: 16px 14px calc(20px + env(safe-area-inset-bottom)); }
  .hero { padding: 26px 20px; }
  .hero h1 { font-size: 22px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .module-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .module-card { padding: 16px; }
  .chapter-item, .quiz-opt, .nav-item { min-height: 48px; }
  .quiz-opt { align-items: center; }
  .btn { min-height: 44px; padding: 11px 20px; }
  .read-actions { flex-wrap: wrap; }
  .read-actions .btn { flex: 1 1 auto; }
  .section-block table { font-size: 13px; }
}

/* ===== 进度导入导出弹窗 ===== */
.modal-mask {
  position: fixed; inset: 0; background: rgba(15, 23, 42, .5);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 16px;
}
.modal {
  background: #fff; border-radius: 12px; padding: 20px;
  width: 100%; max-width: 480px; box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
}
.modal h3 { margin: 0 0 12px; font-size: 17px; }
.modal textarea {
  width: 100%; height: 160px; box-sizing: border-box;
  border: 1px solid var(--border); border-radius: 8px; padding: 10px;
  font-size: 12px; font-family: ui-monospace, monospace; resize: vertical;
}
.modal-actions {
  display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: flex-end;
}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">⚙️</div>
      <div class="brand-text">
        <h1>广州造船厂技工学校</h1>
        <p>机电一体化技术学习平台</p>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索知识、章节、关键词…" />
    </div>
    <nav class="nav" id="moduleNav"></nav>
    <div class="sidebar-footer">
      <button class="btn-reset" id="exportBtn" title="导出学习进度到文件/文本">导出进度</button>
      <button class="btn-reset" id="importBtn" title="从文件/文本导入学习进度">导入进度</button>
      <button class="btn-reset" id="resetBtn" title="清除学习进度">重置学习进度</button>
    </div>
  </aside>

  <!-- 主内容 -->
  <main class="main">
    <header class="topbar">
      <button class="btn-menu" id="menuBtn" title="切换菜单">☰</button>
      <div class="breadcrumb" id="breadcrumb">首页</div>
      <div class="topbar-progress">
        <span id="progressText">0%</span>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </header>

    <section class="content" id="content">
      <!-- 动态渲染 -->
    </section>
  </main>
</div>

<script>
// ============================================================
// 机电一体化学习平台 - 知识库数据
// 数据结构：modules[] = { id, title, icon, description, chapters[], quiz[] }
// chapter = { title, desc, sections[] }
// section = { heading, text, points[] }   points 为要点列表
// quiz = { q, options[], answer, explain }
// ============================================================

const MODULES = [
  {
    id: "drawing",
    title: "机械制图与CAD",
    icon: "📐",
    description: "读图与绘图的工程语言，机械设计的表达基础。",
    chapters: [
      {
        title: "制图基本知识与国家标准",
        desc: "了解图纸幅面、比例、字体、图线等基本规定",
        sections: [
          {
            heading: "图纸幅面与图框",
            text: "图纸幅面按国家标准 GB/T 14689 规定，基本幅面有 A0、A1、A2、A3、A4，后一号幅面是前一号的一半。图框用粗实线绘制，标题栏位于图框右下角，用来填写图名、图号、材料、比例等。",
            points: ["A0 面积最大，尺寸 841×1189mm", "A4 最小，210×297mm", "幅面代号越大，图纸尺寸越小"]
          },
          {
            heading: "比例与字体",
            text: "比例是图中图形与实物相应要素的线性尺寸之比。原值比例 1:1，放大比例如 2:1，缩小比例如 1:2。图样中的尺寸数值始终标注真实尺寸，不受比例影响。",
            points: ["比例 = 图上尺寸 : 实际尺寸", "尺寸标注永远写真实尺寸", "汉字应写成长仿宋体"]
          },
          {
            heading: "图线及应用",
            text: "机械制图常用图线：粗实线（可见轮廓线）、细虚线（不可见轮廓线）、细点画线（轴线、对称中心线）、细实线（尺寸线、剖面线）、波浪线（断裂边界）。",
            points: ["粗实线——可见轮廓", "虚线——不可见轮廓", "点画线——轴线与对称中心线"]
          }
        ]
      },
      {
        title: "三视图与投影基础",
        desc: "用正投影法表达空间形体",
        sections: [
          {
            heading: "正投影与三视图",
            text: "将物体分别向三个互相垂直的投影面（正面 V、水平面 H、侧面 W）作正投影，展开后得到三视图：主视图、俯视图、左视图。",
            points: ["主视图——从前向后看", "俯视图——从上向下看", "左视图——从左向右看"]
          },
          {
            heading: "三视图投影规律",
            text: "三视图之间遵循\"长对正、高平齐、宽相等\"的投影规律：主俯视图长对正，主左视图高平齐，俯左视图宽相等。",
            points: ["长对正（主、俯）", "高平齐（主、左）", "宽相等（俯、左）"]
          }
        ]
      },
      {
        title: "剖视图与断面图",
        desc: "表达机件内部结构的方法",
        sections: [
          {
            heading: "剖视图",
            text: "假想用剖切面剖开机件，将位于观察者和剖切面之间的部分移去，将其余部分向投影面投射所得的图形称为剖视图。剖切面与机件接触的部分画上剖面符号（45°细实线）。",
            points: ["全剖视图——整个剖开", "半剖视图——一半剖开，适用于对称机件", "局部剖视图——局部剖开"]
          },
          {
            heading: "断面图",
            text: "假想用剖切面将机件某处切断，只画出切断面的图形称为断面图。分移出断面图和重合断面图。",
            points: ["断面图只画断面形状", "剖面线为 45° 细实线", "移出断面图画在视图之外"]
          }
        ]
      },
      {
        title: "尺寸标注与表面粗糙度",
        desc: "完整、清晰地标注尺寸和技术要求",
        sections: [
          {
            heading: "尺寸标注基本规则",
            text: "尺寸标注应做到正确、完整、清晰、合理。一个尺寸一般由尺寸界线、尺寸线、尺寸数字和箭头组成。",
            points: ["机件的真实大小以所注尺寸为准", "每个尺寸一般只标注一次", "直径标注 φ，半径标注 R"]
          },
          {
            heading: "表面粗糙度",
            text: "表面粗糙度用 Ra 值表示轮廓算术平均偏差，单位为微米（μm）。数值越小表面越光滑，加工精度越高。",
            points: ["Ra 越小越光滑", "符号 √ 表示去除材料获得", "粗糙度影响配合与耐磨性"]
          }
        ]
      }
    ],
    quiz: [
      { q: "三视图的投影规律中，主视图与俯视图之间的关系是？", options: ["高平齐", "长对正", "宽相等", "以上都不是"], answer: 1, explain: "主视图与俯视图沿长度方向对齐，即\"长对正\"。" },
      { q: "机械制图中，虚线用来表示？", options: ["可见轮廓线", "不可见轮廓线", "轴线", "尺寸线"], answer: 1, explain: "细虚线表示不可见的轮廓线。" },
      { q: "图纸基本幅面中面积最大的是？", options: ["A4", "A3", "A2", "A0"], answer: 3, explain: "A0 幅面最大，尺寸 841×1189mm。" },
      { q: "表面粗糙度 Ra 值越小表示？", options: ["表面越粗糙", "表面越光滑", "与表面质量无关", "颜色越深"], answer: 1, explain: "Ra 为轮廓算术平均偏差，数值越小表面越光滑。" },
      { q: "剖视图中剖面符号一般用什么线型绘制？", options: ["粗实线", "45°细实线", "点画线", "波浪线"], answer: 1, explain: "剖面符号用 45° 细实线（剖面线）绘制。" }
    ]
  },

  {
    id: "mechanics",
    title: "工程力学",
    icon: "⚖️",
    description: "研究构件的受力、平衡与变形规律。",
    chapters: [
      {
        title: "静力学基础",
        desc: "力的概念与刚体平衡条件",
        sections: [
          {
            heading: "力的三要素与公理",
            text: "力对物体的作用效果取决于力的大小、方向和作用点，称为力的三要素。静力学基本公理包括二力平衡公理、加减平衡力系公理、作用与反作用公理等。",
            points: ["力的三要素：大小、方向、作用点", "二力平衡：等值、反向、共线", "作用力与反作用力大小相等、方向相反"]
          },
          {
            heading: "受力分析与平衡方程",
            text: "对物体进行受力分析，画出受力图（隔离体图）。平面一般力系的平衡条件为：ΣFx=0、ΣFy=0、ΣM=0，可求解三个未知量。",
            points: ["ΣFx = 0", "ΣFy = 0", "ΣM = 0"]
          }
        ]
      },
      {
        title: "材料力学基础",
        desc: "构件在载荷作用下的强度、刚度与稳定性",
        sections: [
          {
            heading: "应力与应变",
            text: "应力 σ = F/A（单位截面面积上的内力），单位 Pa。应变 ε 是相对变形量。材料在弹性阶段满足胡克定律 σ = E·ε，E 为弹性模量。",
            points: ["σ = F / A", "胡克定律 σ = E·ε", "E 为弹性模量，表征材料刚度"]
          },

<script>
// ============================================================
// 机电一体化学习平台 - 交互与渲染逻辑
// ============================================================

const STORAGE_KEY = "mechatronics_progress_v1";

// ---------- 状态管理 ----------
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore */ }
  return { completed: {}, quiz: {} };
}

let state = loadState();

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { /* ignore */ }
}

function isChapterDone(moduleId, idx) {
  return state.completed[moduleId] && state.completed[moduleId].includes(idx);
}

function setChapterDone(moduleId, idx, done) {
  if (!state.completed[moduleId]) state.completed[moduleId] = [];
  const arr = state.completed[moduleId];
  if (done && !arr.includes(idx)) arr.push(idx);
  if (!done) state.completed[moduleId] = arr.filter(i => i !== idx);
  saveState();
  updateProgressUI();
  renderNav();
}

function moduleCompletedCount(moduleId) {
  const mod = getModule(moduleId);
  return mod.chapters.filter((c, i) => isChapterDone(moduleId, i)).length;
}

function getModule(id) {
  return MODULES.find(m => m.id === id);
}

// ---------- 进度统计 ----------
function totalChapters() {
  return MODULES.reduce((s, m) => s + m.chapters.length, 0);
}
function completedChapters() {
  let n = 0;
  MODULES.forEach(m => m.chapters.forEach((c, i) => { if (isChapterDone(m.id, i)) n++; }));
  return n;
}
function quizDoneCount() {
  return MODULES.filter(m => state.quiz[m.id] != null).length;
}
function overallProgress() {
  const total = totalChapters() + MODULES.length;
  if (total === 0) return 0;
  return Math.round(((completedChapters() + quizDoneCount()) / total) * 100);
}

// ---------- 工具 ----------
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function highlight(text, query) {
  if (!query) return esc(text);
  const safe = escapeRegExp(query.trim());
  try {
    const re = new RegExp("(" + safe + ")", "gi");
    return esc(text).replace(re, '<span class="search-highlight">$1</span>');
  } catch (e) {
    return esc(text);
  }
}

// ---------- DOM 引用 ----------
const contentEl = document.getElementById("content");
const moduleNav = document.getElementById("moduleNav");
const searchInput = document.getElementById("searchInput");
const breadcrumb = document.getElementById("breadcrumb");
const progressText = document.getElementById("progressText");
const progressFill = document.getElementById("progressFill");
const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const resetBtn = document.getElementById("resetBtn");
const exportBtn = document.getElementById("exportBtn");
const importBtn = document.getElementById("importBtn");

let currentLocation = null; // { type: 'home'|'module'|'chapter'|'quiz'|'search', moduleId?, chapterIdx? }

// ---------- 渲染导航 ----------
function renderNav() {
  let html = "";
  MODULES.forEach(m => {
    const done = moduleCompletedCount(m.id);
    const total = m.chapters.length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const active = currentLocation && currentLocation.moduleId === m.id ? "active" : "";
    html += `
      <div class="nav-item ${active}" data-id="${m.id}">
        <span class="ico">${m.icon}</span>
        <span class="label">${esc(m.title)}</span>
        <span class="pct">${done}/${total}</span>
      </div>`;
  });
  moduleNav.innerHTML = html;
  moduleNav.querySelectorAll(".nav-item").forEach(el => {
    el.addEventListener("click", () => { showModule(el.dataset.id); closeMenu(); });
  });
}

function updateProgressUI() {
  const p = overallProgress();
  progressText.textContent = p + "%";
  progressFill.style.width = p + "%";
}

function setBreadcrumb(html) {
  breadcrumb.innerHTML = html;
}

// ---------- 首页 ----------
function showHome() {
  currentLocation = { type: "home" };
  renderNav();
  setBreadcrumb("首页");

  const doneC = completedChapters();
  const totalC = totalChapters();
  const totalQ = MODULES.length;
  const doneQ = quizDoneCount();

  let pathHtml = LEARNING_PATH.map((p, i) => {
    const mod = getModule(p.moduleId);
    const done = mod && doneC > 0 && moduleCompletedCount(p.moduleId) === mod.chapters.length;
    return `
      <div class="chapter-item" style="cursor:pointer" data-path="${p.moduleId}">
        <div class="idx">${i + 1}</div>
        <div class="c-info">
          <div class="c-title">${esc(p.title)}</div>
          <div class="c-desc">${esc(p.desc)}</div>
        </div>
        ${done ? '<span class="done-mark">✓</span>' : ""}
      </div>`;
  }).join("");

  let gridHtml = MODULES.map(m => {
    const done = moduleCompletedCount(m.id);
    const total = m.chapters.length;
    const quizDone = state.quiz[m.id] != null;
    let badge = "";
    if (done === total && quizDone) badge = '<span class="badge badge-done">已完成</span>';
    else if (done > 0 || quizDone) badge = '<span class="badge badge-ing">学习中</span>';
    return `
      <div class="module-card" data-id="${m.id}">
        <div class="m-ico">${m.icon}</div>
        <h3>${esc(m.title)}</h3>
        <p>${esc(m.description)}</p>
        <div class="m-meta"><span>${done}/${total} 章节</span><span>${badge}</span></div>
      </div>`;
  }).join("");

  contentEl.innerHTML = `
    <div class="hero">
      <h1>欢迎来到广州造船厂技工学校机电一体化技术学习平台</h1>
      <p>从机械、电工电子到传感器、控制、PLC 与机器人，系统化掌握机电一体化核心知识。</p>
    </div>
    <div class="stats">
      <div class="stat"><div class="num">${totalC}</div><div class="lbl">学习章节</div></div>
      <div class="stat"><div class="num">${doneC}</div><div class="lbl">已完成章节</div></div>
      <div class="stat"><div class="num">${totalQ}</div><div class="lbl">知识模块</div></div>
      <div class="stat"><div class="num">${overallProgress()}%</div><div class="lbl">总进度</div></div>
    </div>
    <div class="card">
      <h2>📚 推荐学习路径</h2>
      <p class="muted">建议按以下顺序循序渐进学习</p>
      ${pathHtml}
    </div>
    <h2 style="margin:8px 0 16px">全部知识模块</h2>
    <div class="module-grid">${gridHtml}</div>`;

  contentEl.querySelectorAll(".module-card").forEach(el => {
    el.addEventListener("click", () => showModule(el.dataset.id));
  });
  contentEl.querySelectorAll("[data-path]").forEach(el => {
    el.addEventListener("click", () => showModule(el.dataset.path));
  });
}

// ---------- 模块详情 ----------
function showModule(moduleId) {
  const mod = getModule(moduleId);
  if (!mod) return;
  currentLocation = { type: "module", moduleId };
  renderNav();
  setBreadcrumb(`<span style="color:#6b7280">首页</span> / ${esc(mod.title)}`);

  let chaptersHtml = mod.chapters.map((c, i) => {
    const done = isChapterDone(moduleId, i);
    return `
      <div class="chapter-item" data-chapter="${i}">
        <div class="idx">${i + 1}</div>
        <div class="c-info">
          <div class="c-title">${esc(c.title)}</div>
          <div class="c-desc">${esc(c.desc)}</div>
        </div>
        ${done ? '<span class="done-mark">✓</span>' : ""}
      </div>`;
  }).join("");

  const quizDone = state.quiz[moduleId] != null;
  const lastScore = quizDone ? state.quiz[moduleId].score + "/" + state.quiz[moduleId].total : "未完成";

  contentEl.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="font-size:40px">${mod.icon}</div>
        <div>
          <h2 style="margin:0">${esc(mod.title)}</h2>
          <p class="muted" style="margin:0">${esc(mod.description)}</p>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>章节学习（${mod.chapters.length}）</h2>
      ${chaptersHtml}
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
        <div>
          <h2 style="margin:0">📝 课后测验</h2>
          <p class="muted" style="margin:4px 0 0">上次成绩：${lastScore}</p>
        </div>
        <button class="btn btn-primary" id="startQuizBtn">开始测验</button>
      </div>
    </div>`;

  contentEl.querySelectorAll(".chapter-item").forEach(el => {
    el.addEventListener("click", () => showChapter(moduleId, parseInt(el.dataset.chapter, 10)));
  });
  contentEl.querySelector("#startQuizBtn").addEventListener("click", () => showQuiz(moduleId));
}

// ---------- 章节阅读 ----------
function showChapter(moduleId, idx) {
  const mod = getModule(moduleId);
  const chapter = mod.chapters[idx];
  currentLocation = { type: "chapter", moduleId, chapterIdx: idx };
  renderNav();
  setBreadcrumb(`<span style="color:#6b7280">${esc(mod.title)}</span> / ${esc(chapter.title)}`);

  let sectionsHtml = chapter.sections.map(s => {
    let pointsHtml = s.points && s.points.length ? `<ul>${s.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : "";
    return `
      <div class="section-block">
        <h3>${esc(s.heading)}</h3>
        <p>${esc(s.text)}</p>
        ${pointsHtml}
      </div>`;
  }).join("");

  const isLast = idx >= mod.chapters.length - 1;
  const isFirst = idx === 0;
  const done = isChapterDone(moduleId, idx);

  contentEl.innerHTML = `
    <div class="card read-head">
      <h2>${idx + 1}. ${esc(chapter.title)}</h2>
      <span class="muted">${esc(mod.title)} · ${esc(chapter.desc)}</span>
    </div>
    <div class="card">${sectionsHtml}</div>
    <div class="read-actions">
      ${!isFirst ? `<button class="btn btn-outline" id="prevBtn">← 上一节</button>` : ""}
      <button class="btn ${done ? "btn-grey" : "btn-primary"}" id="markDoneBtn">${done ? "✓ 已学完（点击取消）" : "标记为已学完"}</button>
      ${!isLast ? `<button class="btn btn-primary" id="nextBtn">下一节 →</button>` : `<button class="btn btn-primary" id="finishBtn">完成学习，去测验 →</button>`}
    </div>`;

  const prevBtn = contentEl.querySelector("#prevBtn");
  const nextBtn = contentEl.querySelector("#nextBtn");
  const finishBtn = contentEl.querySelector("#finishBtn");
  const markBtn = contentEl.querySelector("#markDoneBtn");

  if (prevBtn) prevBtn.addEventListener("click", () => showChapter(moduleId, idx - 1));
  if (nextBtn) nextBtn.addEventListener("click", () => showChapter(moduleId, idx + 1));
  if (finishBtn) finishBtn.addEventListener("click", () => showQuiz(moduleId));
  markBtn.addEventListener("click", () => {
    setChapterDone(moduleId, idx, !isChapterDone(moduleId, idx));
    showChapter(moduleId, idx);
  });
}

// ---------- 测验 ----------
function showQuiz(moduleId) {
  const mod = getModule(moduleId);
  currentLocation = { type: "quiz", moduleId };
  renderNav();
  setBreadcrumb(`<span style="color:#6b7280">${esc(mod.title)}</span> / 测验`);

  const answers = new Array(mod.quiz.length).fill(-1);
  let submitted = false;

  contentEl.innerHTML = `
    <div class="card">
      <h2>📝 ${esc(mod.title)} · 课后测验</h2>
      <p class="muted">共 ${mod.quiz.length} 题，选择答案后点击\"提交测验\"查看得分与解析。</p>
    </div>
    <div class="card" id="quizBody">
      ${mod.quiz.map((q, qi) => `
        <div class="quiz-q" data-qi="${qi}">
          <div class="q-text">${qi + 1}. ${esc(q.q)}</div>
          ${q.options.map((opt, oi) => `
            <div class="quiz-opt" data-qi="${qi}" data-oi="${oi}">
              <span class="opt-tag">${String.fromCharCode(65 + oi)}</span>
              <span>${esc(opt)}</span>
            </div>`).join("")}
          <div class="quiz-explain" data-qi="${qi}"></div>
        </div>`).join("")}
    </div>
    <div class="read-actions">
      <button class="btn btn-outline" id="backModuleBtn">← 返回模块</button>
      <button class="btn btn-primary" id="submitQuizBtn">提交测验</button>
    </div>`;

  function renderOpts() {
    contentEl.querySelectorAll(".quiz-opt").forEach(el => {
      const qi = parseInt(el.dataset.qi, 10);
      const oi = parseInt(el.dataset.oi, 10);
      if (!submitted) {
        el.classList.toggle("selected", answers[qi] === oi);
      } else {
        const correct = mod.quiz[qi].answer;
        if (oi === correct) el.classList.add("correct");
        else if (oi === answers[qi]) el.classList.add("wrong");
      }
    });
  }

  contentEl.querySelectorAll(".quiz-opt").forEach(el => {
    el.addEventListener("click", () => {
      if (submitted) return;
      const qi = parseInt(el.dataset.qi, 10);
      const oi = parseInt(el.dataset.oi, 10);
      answers[qi] = oi;
      renderOpts();
    });
  });

  contentEl.querySelector("#backModuleBtn").addEventListener("click", () => showModule(moduleId));
  contentEl.querySelector("#submitQuizBtn").addEventListener("click", () => {
    if (submitted) return;
    const unanswered = answers.filter(a => a === -1).length;
    if (unanswered > 0) {
      const c = window.confirm(`还有 ${unanswered} 题未作答，确定提交吗？`);
      if (!c) return;
    }
    submitted = true;
    let score = 0;
    mod.quiz.forEach((q, qi) => {
      if (answers[qi] === q.answer) score++;
      const explainEl = contentEl.querySelector(`.quiz-explain[data-qi="${qi}"]`);
      const correctTag = String.fromCharCode(65 + q.answer);
      explainEl.innerHTML = `<strong>解析：</strong>${esc(q.explain)} <span style="color:#6b7280">（正确答案 ${correctTag}）</span>`;
      explainEl.classList.add("show");
    });
    state.quiz[moduleId] = { score, total: mod.quiz.length };
    saveState();
    renderOpts();

    const resultHtml = `
      <div class="card score-bar">
        <div class="big">${score} / ${mod.quiz.length}</div>
        <p style="margin:8px 0 16px">${score === mod.quiz.length ? "🎉 太棒了，全部答对！" : score >= mod.quiz.length * 0.6 ? "👍 不错，继续巩固薄弱点。" : "💪 建议回到章节再复习一遍。"}</p>
        <button class="btn btn-primary" id="retryBtn">重新测验</button>
      </div>`;
    contentEl.querySelector("#quizBody").insertAdjacentHTML("afterend", resultHtml);
    contentEl.querySelector("#retryBtn").addEventListener("click", () => showQuiz(moduleId));
    const submitBtn = contentEl.querySelector("#submitQuizBtn");
    submitBtn.textContent = "已提交";
    submitBtn.classList.remove("btn-primary");
    submitBtn.classList.add("btn-grey");
    updateProgressUI();
    renderNav();
  });
}

// ---------- 搜索 ----------
function doSearch(query) {
  query = (query || "").trim();
  if (!query) { showHome(); return; }
  currentLocation = { type: "search", query };
  renderNav();
  setBreadcrumb(`搜索：${esc(query)}`);

  const results = [];
  MODULES.forEach(m => {
    // 匹配模块标题/描述
    if (m.title.includes(query) || m.description.includes(query)) {
      results.push({ type: "module", mod: m, title: m.title, snippet: m.description, moduleId: m.id });
    }
    m.chapters.forEach((c, ci) => {
      // 匹配章节标题/描述
      if (c.title.includes(query) || c.desc.includes(query)) {
        results.push({ type: "chapter", mod: m, chapterIdx: ci, title: m.title + " · " + c.title, snippet: c.desc, moduleId: m.id });
      }
      c.sections.forEach(s => {
        if (s.heading.includes(query) || s.text.includes(query)) {
          results.push({ type: "chapter", mod: m, chapterIdx: ci, title: s.heading, snippet: s.text.slice(0, 80) + "…", moduleId: m.id });
        }
        (s.points || []).forEach(p => {
          if (p.includes(query)) {
            results.push({ type: "chapter", mod: m, chapterIdx: ci, title: s.heading, snippet: p, moduleId: m.id });
          }
        });
      });
    });
    // 匹配测验题
    m.quiz.forEach((q, qi) => {
      if (q.q.includes(query)) {
        results.push({ type: "quiz", mod: m, title: q.q, snippet: q.options[q.answer], moduleId: m.id });
      }
    });
  });

  // 去重（同一模块+章节只保留一条）
  const seen = new Set();
  const unique = results.filter(r => {
    const key = r.type + "|" + r.moduleId + "|" + (r.chapterIdx != null ? r.chapterIdx : "");
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  if (unique.length === 0) {
    contentEl.innerHTML = `<div class="empty"><div class="e-ico">🔍</div><p>未找到与"${esc(query)}"相关的内容</p></div>`;
    return;
  }

  contentEl.innerHTML = `
    <div class="card">
      <h2>搜索结果</h2>
      <p class="muted">找到 ${unique.length} 条相关内容</p>
    </div>
    ${unique.map((r, i) => `
      <div class="chapter-item" data-i="${i}" style="cursor:pointer">
        <div class="idx">${r.type === "quiz" ? "?" : r.type === "module" ? "📚" : ""}</div>
        <div class="c-info">
          <div class="c-title">${highlight(r.title, query)}</div>
          <div class="c-desc">${highlight(r.snippet, query)}</div>
        </div>
      </div>`).join("")}`;

  contentEl.querySelectorAll(".chapter-item").forEach(el => {
    el.addEventListener("click", () => {
      const r = unique[parseInt(el.dataset.i, 10)];
      if (r.type === "chapter") showChapter(r.moduleId, r.chapterIdx);
      else if (r.type === "quiz") showQuiz(r.moduleId);
      else showModule(r.moduleId);
    });
  });
}

// ---------- 事件绑定 ----------
searchInput.addEventListener("input", () => {
  const q = searchInput.value;
  if (q.trim()) doSearch(q);
  else showHome();
});

function closeMenu() {
  sidebar.classList.remove("open");
  document.body.classList.remove("menu-open");
}
menuBtn.addEventListener("click", () => {
  const open = sidebar.classList.toggle("open");
  document.body.classList.toggle("menu-open", open);
});
document.addEventListener("click", e => {
  if (window.innerWidth <= 768 && !sidebar.contains(e.target) && e.target !== menuBtn) {
    closeMenu();
  }
});

resetBtn.addEventListener("click", () => {
  if (window.confirm("确定要清除所有学习进度吗？此操作不可恢复。")) {
    state = { completed: {}, quiz: {} };
    saveState();
    updateProgressUI();
    renderNav();
    showHome();
  }
});

// ---------- 进度导入导出 ----------
function showModal(title, bodyHtml, actionsHtml) {
  const old = document.getElementById("progressModal");
  if (old) old.remove();
  const mask = document.createElement("div");
  mask.id = "progressModal";
  mask.className = "modal-mask";
  mask.innerHTML = `
    <div class="modal">
      <h3>${title}</h3>
      ${bodyHtml}
      <div class="modal-actions">${actionsHtml}</div>
    </div>`;
  mask.addEventListener("click", e => { if (e.target === mask) mask.remove(); });
  document.body.appendChild(mask);
  return mask;
}

exportBtn.addEventListener("click", () => {
  const json = JSON.stringify(state, null, 2);
  let downloaded = false;
  try {
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "机电一体化学习进度.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    downloaded = true;
  } catch (e) { /* 浏览器不支持下载，改用复制 */ }

  const dlg = showModal(
    "导出学习进度",
    `<p class="muted" style="margin-top:0">${downloaded ? "已开始下载进度文件；如未成功，请复制下方文本手动保存。" : "当前浏览器不支持自动下载，请复制下方文本保存。"}</p>
     <textarea readonly id="exportText">${esc(json)}</textarea>`,
    `<button class="btn btn-outline" id="copyBtn">复制全部</button>
     <button class="btn btn-primary" id="closeModalBtn">关闭</button>`
  );
  const ta = dlg.querySelector("#exportText");
  ta.addEventListener("click", () => ta.select());
  dlg.querySelector("#copyBtn").addEventListener("click", () => {
    ta.select();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(() => window.alert("已复制到剪贴板"), () => window.alert("复制失败，请长按文本手动复制"));
    } else {
      try { document.execCommand("copy"); window.alert("已复制到剪贴板"); }
      catch (e) { window.alert("复制失败，请长按文本手动复制"); }
    }
  });
  dlg.querySelector("#closeModalBtn").addEventListener("click", () => dlg.remove());
});

importBtn.addEventListener("click", () => {
  const dlg = showModal(
    "导入学习进度",
    `<p class="muted" style="margin-top:0">粘贴之前导出的进度文本，或点击"读取文件"选择 .json 文件。</p>
     <textarea id="importText" placeholder='粘贴学习进度 JSON…'></textarea>
     <input type="file" id="importFile" accept=".json,application/json,text/plain" style="display:none">`,
    `<button class="btn btn-outline" id="readFileBtn">读取文件</button>
     <button class="btn btn-outline" id="cancelImportBtn">取消</button>
     <button class="btn btn-primary" id="applyImportBtn">导入</button>`
  );
  const ta = dlg.querySelector("#importText");
  const fileInput = dlg.querySelector("#importFile");
  dlg.querySelector("#readFileBtn").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { ta.value = String(r.result || ""); };
    r.readAsText(f);
  });
  function applyImport() {
    const txt = ta.value.trim();
    if (!txt) { window.alert("请先粘贴进度文本或选择文件"); return; }
    try {
      const data = JSON.parse(txt);
      if (!data || typeof data !== "object" || !("completed" in data) || !("quiz" in data)) throw new Error("bad");
      state = { completed: data.completed || {}, quiz: data.quiz || {} };
      saveState();
      updateProgressUI();
      renderNav();
      showHome();
      dlg.remove();
      window.alert("学习进度已成功导入");
    } catch (e) {
      window.alert("导入失败：内容不是有效的进度数据");
    }
  }
  dlg.querySelector("#applyImportBtn").addEventListener("click", applyImport);
  dlg.querySelector("#cancelImportBtn").addEventListener("click", () => dlg.remove());
});

// ---------- 初始化 ----------
function init() {
  updateProgressUI();
  showHome();
}

init();
</script>
